# Tool configuration only — the worker is not (yet) an independently
# installed package. It runs inside apps/api's virtual environment
# (see docs/16_MEMORY.md), so mypy needs to be told where to find the
# `app` package it re-exports from.

[tool.mypy]
# Paths here are resolved relative to the CWD mypy is invoked from
# (repo root — see the documented command in workers/README.md), not
# relative to this file, since it's passed via --config-file.
python_version = "3.12"
mypy_path = "apps/api"
explicit_package_bases = true
disallow_untyped_defs = true
warn_return_any = true
no_implicit_optional = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
